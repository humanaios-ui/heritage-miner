<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img">
<defs><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.33  0 0 0 0 0.2  0 0 0 0.16 0"/></filter>
<radialGradient id="v" cx="50%" cy="50%" r="75%"><stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#5a4524" stop-opacity="0.35"/></radialGradient></defs>
<rect width="600" height="800" fill="#3a3a3a"/>
<g transform="rotate(0 300 400)"><rect x="12" y="10" width="576" height="780" fill="#e9dfc4"/>
<rect x="12" y="10" width="576" height="780" filter="url(#n)"/><rect x="12" y="10" width="576" height="780" fill="url(#v)"/>
<text x="300" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#2b2118" font-weight="bold">Foreword</text>
<text x="70" y="200" font-family="Georgia,serif" font-size="17" fill="#2b2118" >This book gathers what the Alderwick family remembered</text>
<text x="70" y="230" font-family="Georgia,serif" font-size="17" fill="#2b2118" >in the autumn of 1992, set down by Edith Alderwick</text>
<text x="70" y="260" font-family="Georgia,serif" font-size="17" fill="#2b2118" >from letters, kitchen-table talk and one tin box</text>
<text x="70" y="290" font-family="Georgia,serif" font-size="17" fill="#2b2118" >of photographs. It is not a finished history.</text>
<text x="70" y="320" font-family="Georgia,serif" font-size="17" fill="#2b2118" >Where memory and paper disagree we have said so.</text>
</g></svg>
